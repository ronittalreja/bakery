name: Email Processor Cron Job

on:
  schedule:
    # Run every 3 hours (8 times per day)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allow manual triggering
    inputs:
      test_email:
        description: 'Test email address (optional - overrides default recipient)'
        required: false
        type: string

jobs:
  process-emails:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          cd backend
          npm install
          
      - name: Run email processor
        run: |
          cd backend
          node emailProcessor.js
        env:
          API_URL: https://bakery-backend-e92k.onrender.com
          BACKEND_URL: https://bakery-backend-e92k.onrender.com
          GMAIL_EMAIL: monginisshahad@gmail.com
          GMAIL_APP_PASSWORD: jgyl mhui ewjj mjcj
          RECIPIENT_EMAIL: ${{ github.event.inputs.test_email || 'receipt5@mongini.in' }}
          JWT_SECRET: your_jwt_secret
          NODE_ENV: production
