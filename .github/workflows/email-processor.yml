name: Email Processor Cron Job

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual triggering
    inputs:
      test_email:
        description: 'Test email address (optional - overrides default recipient)'
        required: false
        type: string

jobs:
  process-emails:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: Install dependencies
        run: |
          cd backend
          npm install
          
      - name: Run email processor
        run: |
          cd backend
          node scripts/email-to-api-cron.js
        env:
          API_URL: https://r3309.vercel.app/api
          GMAIL_EMAIL: monginisshahad@gmail.com
          GMAIL_APP_PASSWORD: jgyl mhui ewjj mjcj
          RECIPIENT_EMAIL: ${{ github.event.inputs.test_email || 'talrejaronit13@gmail.com' }}
          NODE_ENV: production
